 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:dec(PAYLOAD.salt),iterations:310000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:dec(PAYLOAD.iv)},key,dec(PAYLOAD.ct));
 const html=new TextDecoder().decode(pt);
 try{sessionStorage.setItem("op_mrm_pw",pw)}catch(e){}
 document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=document.getElementById("btn");btn.disabled=true;
 document.getElementById("err").style.display="none";
 try{await tryOpen(document.getElementById("pw").value)}
 catch(err){document.getElementById("err").style.display="block";btn.disabled=false}
});
(async()=>{try{const s=sessionStorage.getItem("op_mrm_pw");if(s)await tryOpen(s)}catch(e){}})();
</script>
</body>
