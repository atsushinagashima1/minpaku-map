<style>
:root{--paper:#FAFAF8;--card:#FFFFFF;--ink:#1A1A17;--sub:#55554F;--muted:#76767E;--line:#E4E4DE;--navy:#2456B3;--deep:#212121;--err:#C8324F}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;min-height:100vh;display:flex;flex-direction:column}
.band{background:linear-gradient(100deg,#212121,#2B2B2B);color:#F5F7FB;padding:14px 24px}
.wordmark{font-family:inherit;font-size:19px;letter-spacing:.14em;font-weight:800;color:#fff}
.wordmark span{font-family:inherit;font-size:11px;letter-spacing:.14em;margin-left:10px;opacity:.72;font-weight:400}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.gate{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(20,25,40,.08);padding:34px 36px;max-width:440px;width:100%}
h1{font-family:inherit;font-size:18px;font-weight:700;margin:0 0 6px;line-height:1.6}
p{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.8}
form{display:flex;gap:8px}
input[type=password]{flex:1;font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
button{font-family:inherit;font-size:13.5px;font-weight:600;padding:10px 18px;border:0;border-radius:8px;background:var(--deep);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.rem{display:flex;align-items:flex-start;gap:8px;margin-top:14px;font-size:12.5px;color:var(--sub);line-height:1.7}
.rem input{margin-top:3px;flex:none}
.rem small{display:block;color:var(--muted);font-size:11.5px}
.err{color:var(--err);font-size:12.5px;margin:12px 0 0;display:none}
.busy{font-size:12.5px;color:var(--muted);margin:12px 0 0;display:none}
footer{text-align:center;font-size:11.5px;color:var(--muted);padding:18px}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
</style>

<body>
<div class="band"><span class="wordmark">JAMM<span>民泊・旅館業 規制動向モニター</span></span></div>
<main>
<div class="gate">
<h1>民泊・旅館業条例マップ（全国47都道府県・保健所設置市・東京23区）</h1>
<p>閲覧用パスワードを入力してください。ご不明の場合は JAMM（一般社団法人民泊・小規模宿泊施設運営・管理事業者協会）事務局までお問い合わせください。</p>
<form id="f">
<input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" aria-label="閲覧用パスワード" required>
<button id="btn" type="submit">開く</button>
</form>
<label class="rem"><input type="checkbox" id="rem" checked><span>この端末では次回から入力を省略する（90日間）<small>共有パソコンでは、このチェックを外してください。解除は画面下部の「この端末の記憶を消す」から行えます。</small></span></label>
<p class="busy" id="busy">確認しています…</p>
<p class="err" id="err">パスワードが違います。</p>
</div>
</main>

const LS="op_mrm_key",DAYS=90;
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const enc=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function keyFromPw(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:dec(PAYLOAD.salt),iterations:310000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function show(key){
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:dec(PAYLOAD.iv)},key,dec(PAYLOAD.ct));
 const html=new TextDecoder().decode(pt);
 // 解析中に document.write すると旧DOM（ゲート）が残るため、読み込み完了を待つ
 if(document.readyState!=="complete"){await new Promise(r=>window.addEventListener("load",r,{once:true}));}
 document.open();document.write(html);document.close();
}
async function remember(key){
 try{
  const raw=await crypto.subtle.exportKey("raw",key);
  localStorage.setItem(LS,JSON.stringify({k:enc(raw),exp:Date.now()+DAYS*86400000}));
 }catch(e){}
}
document.getElementById("f").addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=document.getElementById("btn");btn.disabled=true;
 document.getElementById("err").style.display="none";
 document.getElementById("busy").style.display="block";
 try{
  const key=await keyFromPw(document.getElementById("pw").value);
  if(document.getElementById("rem").checked)await remember(key); else {try{localStorage.removeItem(LS)}catch(e){}}
  await show(key);
 }catch(err){
  document.getElementById("busy").style.display="none";
  document.getElementById("err").style.display="block";btn.disabled=false;
 }
});
// 端末に記憶があれば自動で開く（鍵が古い＝パスワード変更時は破棄して通常の入力に戻す）
(async()=>{
 let saved=null;
 try{saved=JSON.parse(localStorage.getItem(LS)||"null")}catch(e){}
 if(!saved||!saved.k||!(saved.exp>Date.now())){if(saved){try{localStorage.removeItem(LS)}catch(e){}}return;}
 document.getElementById("busy").style.display="block";
 try{
  const key=await crypto.subtle.importKey("raw",dec(saved.k),{name:"AES-GCM"},true,["decrypt"]);
  await show(key);
 }catch(e){
  try{localStorage.removeItem(LS)}catch(e2){}
  document.getElementById("busy").style.display="none";
 }
})();
</script>
