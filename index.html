<style>
:root{--paper:#FAFAF8;--card:#FFFFFF;--ink:#1A1A17;--muted:#76767E;--line:#E4E4DE;--navy:#1E407D;--deep:#15335E;--err:#C8324F}
@media (prefers-color-scheme:dark){:root{--paper:#17171A;--card:#1F1F24;--ink:#ECEDEE;--muted:#96969E;--line:#2E2E34;--navy:#8FAEDC;--err:#D9536B}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;min-height:100vh;display:flex;flex-direction:column}
.band{background:linear-gradient(100deg,#15335E,#1E407D);color:#F5F7FB;padding:14px 24px}
.wordmark{font-family:"EB Garamond",Georgia,serif;font-size:20px;letter-spacing:.04em;font-weight:600;color:#fff}
.wordmark span{font-family:inherit;font-size:11px;letter-spacing:.14em;margin-left:10px;opacity:.72;font-weight:400}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.gate{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(20,25,40,.08);padding:34px 36px;max-width:420px;width:100%}
h1{font-family:"Shippori Mincho","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;font-size:19px;font-weight:600;margin:0 0 6px;line-height:1.6}
p{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.8}
form{display:flex;gap:8px}
input{flex:1;font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
button{font-family:inherit;font-size:13.5px;font-weight:600;padding:10px 18px;border:0;border-radius:8px;background:var(--deep);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:12.5px;margin-top:12px;display:none}
footer{text-align:center;font-size:11.5px;color:var(--muted);padding:18px}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
</style>
</head>
<body>
<div class="band"><span class="wordmark">OpenPolicy<span>規制動向モニター</span></span></div>
<main>
<div class="gate">
<h1>東京23区 民泊・旅館業条例マップ</h1>
<p>閲覧用パスワードを入力してください。ご不明の場合は OpenPolicy株式会社までお問い合わせください。</p>
<form id="f">
<input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" aria-label="閲覧用パスワード" required>
<button id="btn" type="submit">開く</button>
</form>
<p class="err" id="err">パスワードが違います。</p>
</div>
</main>

async function tryOpen(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:dec(PAYLOAD.salt),iterations:310000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:dec(PAYLOAD.iv)},key,dec(PAYLOAD.ct));
 const html=new TextDecoder().decode(pt);
 try{sessionStorage.setItem("op_mrm_pw",pw)}catch(e){}
 document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=document.getElementById("btn");btn.disabled=true;
 document.getElementById("err").style.display="none";
 try{await tryOpen(document.getElementById("pw").value)}
